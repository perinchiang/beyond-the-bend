<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beyond the Bend — graybox driving slice</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234b4e57'/%3E%3Cpath d='M8 15V1' stroke='%23ecebe2' stroke-width='1.5' stroke-dasharray='3 2'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ea; }
      body { font: 500 13px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; color: #2b2c31; user-select: none; -webkit-user-select: none; }
      canvas#view { display: block; width: 100vw; height: 100vh; height: 100dvh; }
      .panel { position: fixed; background: rgba(244, 241, 232, 0.8); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
      #dash { right: 22px; bottom: 20px; padding: 10px 18px 12px; min-width: 150px; text-align: right; }
      #speed { font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      #dash small { font-size: 12px; opacity: 0.6; letter-spacing: 0.08em; margin-left: 4px; }
      #gearRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      #gear { font-size: 20px; font-weight: 700; width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
      #bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(43, 44, 49, 0.14); overflow: hidden; }
      #revs { height: 100%; width: 0; background: #2b2c31; }
      #revs.red { background: #d8452f; }
      #map { position: fixed; left: 20px; top: 20px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(43, 44, 49, 0.12); }
      #map.big { left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px rgba(43, 44, 49, 0.2), 0 20px 60px rgba(30, 40, 50, 0.25); }
      #help { left: 20px; bottom: 20px; padding: 10px 14px; max-width: 330px; font-size: 12px; }
      #help b { font-weight: 700; }
      #help .t { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; margin-bottom: 3px; }
      #help i { font-style: normal; opacity: 0.6; }
      #stats { right: 22px; top: 20px; padding: 8px 12px; white-space: pre; font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
      #toast { left: 50%; top: 26px; transform: translate(-50%, -8px); padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }
      #status { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 22px; font-weight: 700; letter-spacing: 0.08em; }
      [hidden] { display: none !important; }
      body.nohud .panel, body.nohud #map { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="map"></canvas>
    <div id="toast" class="panel"></div>
    <div id="status" class="panel">Building the map…</div>
    <div id="stats" class="panel" hidden></div>
    <div id="dash" class="panel">
      <div><span id="speed">0</span><small>KM/H</small></div>
      <div id="gearRow"><span id="gear">1</span><div id="bar"><div id="revs"></div></div></div>
    </div>
    <div id="help" class="panel">
      <div class="t">Graybox driving slice</div>
      <b>W A S D</b> / arrows drive · <b>Space</b> handbrake<br />
      <b>V</b> view · <b>R</b> back on the road · <b>M</b> map<br />
      <b>1–7</b> jump to a test spot · <b>P</b> autopilot<br />
      <b>`</b> frame times · <b>H</b> hide this<br />
      <i>Gamepad: RT / LT · stick · A handbrake · Y reset · RB view</i>
    </div>
    <script type="module" src="/src/slice/main.ts"></script>
  </body>
</html>
