<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Beyond the Bend — Painted Diorama prototype</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237fb04e'/%3E%3Cpath d='M-1 12C5 12 6 5 17 5' stroke='%235f5b68' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f3ecdd; }
      canvas#view { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      #hud {
        position: fixed; left: 22px; bottom: 18px; color: #4a4338;
        font: 500 12px/1.55 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; user-select: none; pointer-events: none;
        background: rgba(243, 236, 221, 0.72); padding: 10px 14px; border-radius: 10px;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.4s;
      }
      #hud b { font-weight: 700; color: #2f2a22; }
      #hud .t { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
      #hud i { font-style: normal; opacity: 0.6; }
      #hud.hidden { opacity: 0; }
      #toast {
        position: fixed; left: 50%; top: 22px; transform: translate(-50%, -8px); opacity: 0;
        color: #2f2a22; background: rgba(243, 236, 221, 0.86); padding: 7px 16px; border-radius: 999px;
        font: 700 12px/1.4 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.12em; text-transform: uppercase; pointer-events: none; white-space: nowrap;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.35s, transform 0.35s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast.off { display: none; }
      #stats { position: fixed; right: 16px; top: 12px; color: #6b6253; font: 11px ui-monospace, Menlo, monospace; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="t">Beyond the Bend</div>
      <b>W A S D</b> / arrows — drive &nbsp;·&nbsp; <b>Space</b> — brake<br />
      <span id="hud-cam"></span><br />
      <b>T</b> — miniature lens &nbsp;·&nbsp; <b>H</b> — hide
    </div>
    <div id="toast"></div>
    <div id="stats"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
