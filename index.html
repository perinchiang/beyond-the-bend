<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Beyond the Bend — Painted Diorama prototype</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237fb04e'/%3E%3Cpath d='M-1 12C5 12 6 5 17 5' stroke='%235f5b68' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f3ecdd; }
      canvas#view { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      #hud {
        position: fixed; left: 22px; bottom: 18px; color: #4a4338;
        font: 500 12px/1.55 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; user-select: none; pointer-events: none;
        background: rgba(243, 236, 221, 0.72); padding: 10px 14px; border-radius: 10px;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.4s;
      }
      #hud b { font-weight: 700; color: #2f2a22; }
      #hud .t { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
      #hud i { font-style: normal; opacity: 0.6; }
      #hud.hidden { opacity: 0; }
      #toast {
        position: fixed; left: 50%; top: 22px; transform: translate(-50%, -8px); opacity: 0;
        color: #2f2a22; background: rgba(243, 236, 221, 0.86); padding: 7px 16px; border-radius: 999px;
        font: 700 12px/1.4 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.12em; text-transform: uppercase; pointer-events: none; white-space: nowrap;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: opacity 0.35s, transform 0.35s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast.off { display: none; }
      #stats { position: fixed; right: 16px; top: 12px; color: #6b6253; font: 11px ui-monospace, Menlo, monospace; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="t">Beyond the Bend</div>
      <b>W A S D</b> / arrows — drive &nbsp;·&nbsp; <b>Space</b> — brake · <b>Shift</b> — slide<br />
      <span id="hud-cam"></span><br />
      <b>T</b> — miniature lens &nbsp;·&nbsp; <b>H</b> — hide
    </div>
    <section id="drive-hud" aria-label="Driving information" hidden>
      <div class="speed-row">
        <span class="speed-reading"><strong id="speed">0</strong> km/h</span>
        <button id="map-toggle" type="button" aria-label="Collapse minimap" aria-controls="map-panel" aria-expanded="true">Map ▴</button>
      </div>
      <div id="map-panel">
        <svg id="minimap" viewBox="-190 -185 380 370" role="img" aria-label="Road map, north up">
          <text x="-172" y="-138" class="north">N</text>
          <path id="map-lane" fill="none" stroke="#a78252" stroke-width="5"/>
          <path id="map-road" fill="none" stroke="#736d59" stroke-width="6" stroke-linejoin="round"/>
          <path id="mill-pin" d="M-7 6V-2L-1-7L3-4V-10H6V6Z" fill="#976650" stroke="#fff4d9" stroke-width="2" visibility="hidden"><title>Old sawmill</title></path>
          <path id="station-pin" d="M0 -14 L14 0 0 14 -14 0Z" fill="#536e68" stroke="#fffae7" stroke-width="3" visibility="hidden"/>
          <path id="map-car" d="M0 -23 L17 15 0 9 -17 15Z" fill="#a34231" stroke="#fff8df" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <div id="destination" role="status" hidden>Foothill Station</div>
      <button type="button" id="road-action" hidden></button>
    </section>
    <button id="pause-toggle" type="button" aria-haspopup="dialog" aria-controls="pause-menu">Pause</button>
    <dialog id="pause-menu" aria-labelledby="pause-title">
      <h2 id="pause-title">Paused</h2>
      <div id="journal" aria-live="polite"></div>
      <label id="pass-label" hidden>Travel <select id="passes" aria-label="Visited passes"><option value="">Choose pass</option></select></label>
      <div id="garage">
        <button id="return-village" type="button" hidden>Return to the village</button>
        <button id="garage-car" type="button"></button>
        <button id="garage-tune" type="button"></button>
      </div>
      <label><span>Road guidance</span><input type="checkbox" id="guide-toggle" /></label>
      <label><span>Mute driving sounds</span><input type="checkbox" id="sound-toggle" /></label>
      <button type="button" id="resume-drive" autofocus>Resume drive</button>
    </dialog>
    <select id="travel" aria-label="Debug travel" hidden disabled>
      <option value="">Debug</option>
      <option disabled id="build-id"></option>
      <option value="town">Village exit</option>
      <option value="fork">Hayfield fork</option>
      <option value="bend">Meadow bend</option>
      <option value="station">Foothill Station</option>
      <option value="circuit">Original circuit</option>
    </select>
    <div id="toast"></div>
    <div id="stats"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
