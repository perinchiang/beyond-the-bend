}
function show() {
  const f = frames[scene], compare = view === 'compare';
  picture.style.cursor = compare ? 'ew-resize' : 'default';
  const [left, right] = pair.value.split(',');
  const base = find('#base'), overlay = find('#overlay');
  base.src = f[compare ? right : view];
  base.alt = f.name+' · '+names[compare ? right : view];
  overlay.style.display = compare ? 'block' : 'none';
  if (compare) {
    overlay.src = f[left];
    overlay.alt = f.name+' · '+names[left];
  }
  find('.compare-tools').hidden = !compare;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  document.querySelectorAll('.views button').forEach((b,i) => b.setAttribute('aria-pressed', i === scene));
  document.querySelectorAll('[data-drive]').forEach(a => {
    a.href = 'https://perinchiang.github.io/beyond-the-bend/?s='+f.s+'&preset=2&study='+a.dataset.drive;
  });
  split(Number(slider.value));
}
frames.forEach((f,i) => {
  const button = document.createElement('button');
  button.textContent = f.name;
  button.onclick = () => { scene = i; show(); };
  find('.views').append(button);
});
document.querySelectorAll('[data-view]').forEach(button => {
  button.onclick = () => {
    const next = button.dataset.view;
    if (next === 'compare') {
      if (view !== 'compare' && !pair.value.split(',').includes(view)) pair.value = view === 'print' ? 'gouache,print' : 'gouache,oil';
      slider.value = 50;
    }
    view = next;
    show();
  };
});
pair.onchange = () => { slider.value = 50; show(); };
slider.oninput = () => split(Number(slider.value));
function drag(e) {
  const r = picture.getBoundingClientRect();
  split(Math.round((e.clientX-r.left)*100/r.width));
}
picture.onpointerdown = e => {
  if (view !== 'compare') return;
  picture.setPointerCapture(e.pointerId);
  drag(e);
};
picture.onpointermove = e => { if (picture.hasPointerCapture(e.pointerId)) drag(e); };
picture.ondragstart = e => e.preventDefault();
show();
</script></html>
