const find=q=>document.querySelector(q);
const slider=find('input'), modeButtons=[...document.querySelectorAll('[data-mode]')];
function split(n){
  n=Number(n);
  find('#oil').style.clipPath='inset(0 '+(100-n)+'% 0 0)';
  find('.rule').style.left=n+'%';
  find('.rule').hidden=n===0||n===100;
  slider.value=n;
  modeButtons.forEach((b,i)=>b.setAttribute('aria-pressed',i===(n===100?0:n===0?2:1)));
}
function show(i){
  const f=frames[i];
  find('#base').src=f.print;find('#oil').src=f.oil;
  document.querySelectorAll('.views button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
  for(const [id,style] of [['#driveOil','oil'],['#drivePrint','print']]){
    find(id).href='https://perinchiang.github.io/beyond-the-bend/?s='+f.s+'&preset=2&study='+style;
  }
}
frames.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.name;b.onclick=()=>show(i);find('.views').append(b)});
slider.oninput=()=>split(slider.value);
const picture=find('.frame');
const drag=e=>{const r=picture.getBoundingClientRect();split(Math.max(0,Math.min(100,Math.round((e.clientX-r.left)*100/r.width))))};
picture.onpointerdown=e=>{picture.setPointerCapture(e.pointerId);drag(e)};
picture.onpointermove=e=>{if(picture.hasPointerCapture(e.pointerId))drag(e)};
picture.ondragstart=e=>e.preventDefault();
modeButtons.forEach(b=>b.onclick=()=>split(b.dataset.mode));
show(0);split(50);
</script></html>
